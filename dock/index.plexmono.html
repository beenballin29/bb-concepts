.bot{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:#5e4630}

 const d=ox.getImageData(0,0,w,h).data,step=W<600?3:4,cx=(W-w)/2,cy=H*.36-h/2;P=[];
 for(let yy=0;yy<h;yy+=step)for(let xx=0;xx<w;xx+=step){const i=(yy*w+xx)*4;if(d[i+3]>140){const a=Math.random()*6.283,r=Math.max(W,H)*(.35+Math.random()*.5);

addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
addEventListener('pointerdown',e=>{if(!e.target.closest('.dock,.form'))hold=true});addEventListener('pointerup',()=>hold=false);
addEventListener('wheel',e=>{asm=Math.min(1,Math.max(0,asm+e.deltaY*.0008))});

loop();

sat.addEventListener('pointermove',e=>{if(!drag)return;const max=dock.clientWidth-53;let l=Math.min(max,Math.max(5,e.clientX-sx));sat.style.left=l+'px';fill.style.width=(l+48)+'px';
